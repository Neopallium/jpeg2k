[package]
name = "jpeg2k"
version = "0.11.0"
authors = ["Robert G. Jakabosky <rjakabosky+neopallium@neoawareness.com>"]
edition = "2021"
license = "MIT/Apache-2.0"
description = "JPEG 2000 image loader."
keywords = ["j2k", "jp2", "jpeg2000", "image"]
repository = "https://github.com/Neopallium/jpeg2k"
homepage = "https://github.com/Neopallium/jpeg2k"

exclude = [
  "benches/*",
  "examples/*",
  "samples/*",
]

[features]
default = ["image", "threads"]

# Enable the `image` crate interop (`get_pixels`/`ImageData`/`ImagePixelData`
# and the `DynamicImage` conversions).
image = ["openjp2/image", "dep:image"]

# Enable multi-threaded decode/encode (openjp2's `rayon` feature).
threads = ["openjp2/rayon"]

# `serde` derives for `ImageData`/`ImagePixelData` (and the other
# `openjp2` safe-API types), forwarded to `openjp2`'s `serde` feature.
serde = ["openjp2/serde"]

# Write the upstream OpenJPEG product/version string into the default
# codestream comment (COM) marker, making encoded files byte-identical
# to the C reference (openjp2's `openjpeg-version-string` feature).
openjpeg-version-string = ["openjp2/openjpeg-version-string"]

[dependencies]
openjp2 = { version = "0.7.2", default-features = false }

image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

[dev-dependencies]
dotenv = "0.15"
env_logger = "0.9"
criterion = "0.3"
rayon = "1.7"
anyhow = "1.0"

[[bench]]
name = "components"
harness = false
